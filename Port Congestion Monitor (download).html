  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ility', outlet:'Seatrade', date:'Jun 22, 2026', signal:'Fewer berths available' }\n      ] },\n    { id:'AEJEA', name:'Jebel Ali', country:'United Arab Emirates', lat:25.01, lng:55.06, level:'moderate', vessels:7, waitH:20, berth:77, trend:'improving', conf:'high', updatedText:'40 min ago', iso:'2026-06-29T09:10:00Z',\n      summary:'Operations normalizing after the seasonal peak; ample berth capacity is keeping waits contained.',\n      dataQuality:'Good source agreement; the improving trend is supported.',\n      sources:[\n        { title:'Jebel Ali throughput steady as waits ease', outlet:'TradeWinds', date:'Jun 27, 2026', signal:'~7 vessels; waits easing' },\n        { title:'DP World reports smooth Jebel Ali operations', outlet:'Container News', date:'Jun 25, 2026', signal:'Berth capacity adequate' }\n      ] },\n    { id:'KRPUS', name:'Busan', country:'South Korea', lat:35.10, lng:129.04, level:'low', vessels:5, waitH:12, berth:71, trend:'stable', conf:'high', updatedText:'27 min ago', iso:'2026-06-29T09:23:00Z',\n      summary:'Fluid operations with minimal waiting. Transshipment volumes are healthy without congestion pressure.',\n      dataQuality:'Well covered; figures are consistent and current.',\n      sources:[\n        { title:'Busan stays fluid as transshipment holds steady', outlet:'Splash247', date:'Jun 28, 2026', signal:'~5 vessels; minimal waits' }\n      ] },\n    { id:'JPKWS', name:'Kawasaki', country:'Japan', lat:35.51, lng:139.71, level:'low', vessels:3, waitH:7, berth:64, trend:'improving', conf:'low', updatedText:'5h ago', iso:'2026-06-29T04:45:00Z',\n      summary:'Limited recent reporting; available signals indicate light activity and no notable congestion in Tokyo Bay.',\n      dataQuality:'Only qualitative mentions found — no published vessel counts. Figures are best-effort estimates; low confidence.',\n      sources:[\n        { title:'Tokyo Bay ports report routine operations', outlet:'Seatrade', date:'Jun 21, 2026', signal:'No congestion noted (qualitative)' }\n      ] }\n  ];\n\n  waitText(h){ if(h < 24) return h + 'h'; const d = Math.floor(h/24), r = h % 24; return r ? (d + 'd ' + r + 'h') : (d + 'd'); }\n\n  proj(lat, lng){\n    const x = Math.max(2, Math.min(98, (lng + 120) / 270 * 100));\n    const y = Math.max(4, Math.min(96, (60 - lat) / 70 * 100));\n    return { x, y };\n  }\n\n  selectPort(id){ this.setState({ selectedId: id }); }\n  setView(v){ this.setState({ view: v }); }\n\n  confDots(filled, color){\n    return [0,1,2].map(i => ({ style: 'width:6px;height:6px;border-radius:50%;background:' + (i < filled ? color : '#d4dae1') + ';' }));\n  }\n\n  renderVals(){\n    const accent = this.props.accentColor ?? '#0e7490';\n    const showJson = this.props.showJson ?? true;\n    const view = this.state.view ?? (this.props.defaultView ?? 'map');\n    const isMap = view === 'map';\n\n    const ports = this.RAW.map(p => {\n      const L = this.LEVELS[p.level], T = this.TRENDS[p.trend], C = this.CONF[p.conf];\n      const pos = this.proj(p.lat, p.lng);\n      const wt = this.waitText(p.waitH);\n      return {\n        ...p, waitText: wt, x: pos.x, y: pos.y,\n        levelLabel: L.label, dotColor: L.dot, dotHalo: L.halo, levelColor: L.color, rank: L.rank,\n        trendArrow: T.arrow, trendLabel: T.label, trendColor: T.color,\n        confShort: C.short, confColor: C.color, confDots: this.confDots(C.filled, C.color),\n        sourceCount: p.sources.length,\n        levelBadge: 'display:inline-block;font-weight:600;font-size:11px;padding:3px 9px;border-radius:20px;background:' + L.bg + ';color:' + L.color + ';white-space:nowrap;',\n        berthBarStyle: 'height:100%;width:' + p.berth + '%;background:' + L.dot + ';border-radius:5px;',\n        onSelect: () => this.selectPort(p.id),\n        markerTitle: p.name + ' · ' + p.vessels + ' vessels · ' + wt + ' wait'\n      };\n    }).sort((a,b) => b.rank - a.rank || b.vessels - a.vessels);\n\n    const selId = this.state.selectedId;\n    let sel = ports.find(p => p.id === selId) || ports[0];\n\n    ports.forEach((p, i) => {\n      const selected = p.id === sel.id;\n      p.isSelected = selected;\n      p.rowStyle = 'padding:13px 18px;cursor:pointer;border-bottom:1px solid #f2f4f7;border-left:3px solid ' + (selected ? p.dotColor : 'transparent') + ';background:' + (selected ? '#f7fafc' : '#fff') + ';transition:background .12s;';\n      p.tableRowStyle = 'display:grid;grid-template-columns:1.6fr 0.9fr 0.7fr 0.8fr 0.7fr 0.9fr 1fr;align-items:center;padding:12px 18px;cursor:pointer;border-bottom:1px solid #f2f4f7;background:' + (selected ? '#f7fafc' : '#fff') + ';border-left:3px solid ' + (selected ? p.dotColor : 'transparent') + ';';\n      const size = Math.round(15 + p.vessels * 0.85);\n      p.markerStyle = 'position:absolute;left:' + p.x + '%;top:' + p.y + '%;transform:translate(-50%,-50%);width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + p.dotColor + ';border:2.5px solid #fff;cursor:pointer;z-index:' + (10 + i) + ';box-shadow:' + (selected ? '0 0 0 4px ' + accent + ',0 2px 8px rgba(0,0,0,0.25)' : '0 2px 6px rgba(15,27,45,0.28)') + ';' + (p.level === 'severe' ? 'animation:pulseRing 2s infinite;' : '');\n      p.calloutStyle = 'position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);background:#fff;border:1px solid #e1e7ee;border-radius:9px;padding:8px 11px;box-shadow:0 6px 18px rgba(15,27,45,0.16);white-space:nowrap;z-index:50;pointer-events:none;';\n    });\n\n    const C = this.CONF[sel.conf];\n    sel.headerStyle = 'padding:18px;background:' + this.LEVELS[sel.level].header + ';';\n    sel.dqStyle = 'background:#f6f8fa;border:1px solid #eef1f4;border-left:3px solid ' + sel.dotColor + ';border-radius:9px;padding:11px 13px;';\n    sel.dqAccent = sel.levelColor;\n    sel.jsonText = JSON.stringify({\n      port: sel.name, locode: sel.locode = sel.id, country: sel.country,\n      coordinates: { lat: sel.lat, lng: sel.lng },\n      congestion_level: sel.level,\n      vessels_at_anchorage: sel.vessels,\n      avg_waiting_time_hours: sel.waitH,\n      berth_utilization_pct: sel.berth,\n      delay_trend: sel.trend,\n      confidence: sel.conf,\n      last_updated: sel.iso,\n      sources_count: sel.sources.length,\n      data_quality_note: sel.dataQuality\n    }, null, 2);\n\n    ports.forEach(p => { p.locode = p.id; });\n\n    const totalVessels = ports.reduce((s,p) => s + p.vessels, 0);\n    const elevated = ports.filter(p => p.rank >= 3).length;\n    const avgWait = Math.round(ports.reduce((s,p) => s + p.waitH, 0) / ports.length);\n\n    const kpis = [\n      { label:'Ports tracked', value:'9', sub:'across 6 regions', color:'#0f1b2d' },\n      { label:'Elevated (High +)', value:String(elevated), sub:'of 9 ports', color:'#c2410c' },\n      { label:'Vessels at anchorage', value:String(totalVessels), sub:'total waiting', color:'#0f1b2d' },\n      { label:'Avg waiting time', value:avgWait + 'h', sub:'across ports', color:'#0f1b2d' },\n      { label:'Articles scanned', value:'64', sub:'17 cited', color:accent }\n    ];\n\n    const legend = [\n      { label:'Low', color:'#22c55e' }, { label:'Moderate', color:'#eab308' },\n      { label:'High', color:'#f97316' }, { label:'Severe', color:'#ef4444' }\n    ];\n\n    const regionDefs = [\n      { label:'N. AMERICA', lat:40, lng:-100 }, { label:'EUROPE', lat:50, lng:10 },\n      { label:'MIDDLE EAST', lat:27, lng:50 }, { label:'S. ASIA', lat:18, lng:80 },\n      { label:'E. ASIA', lat:38, lng:125 }\n    ];\n    const regions = regionDefs.map(r => {\n      const pos = this.proj(r.lat, r.lng);\n      return { label:r.label, style:'position:absolute;left:' + pos.x + '%;top:' + pos.y + '%;transform:translate(-50%,-50%);font-family:\\'Schibsted Grotesk\\',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(15,27,45,0.22);pointer-events:none;' };\n    });\n\n    const mapBg = 'background-color:#e7eef4;background-image:linear-gradient(rgba(14,116,144,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,116,144,0.06) 1px,transparent 1px);background-size:9.09% 14.28%;';\n\n    const tabBase = 'border:none;cursor:pointer;font-family:\\'Public Sans\\',sans-serif;font-size:13px;font-weight:600;padding:7px 18px;border-radius:6px;transition:all .12s;';\n    const mapTabStyle = tabBase + (isMap ? 'background:' + accent + ';color:#fff;' : 'background:transparent;color:#5b6675;');\n    const boardTabStyle = tabBase + (!isMap ? 'background:' + accent + ';color:#fff;' : 'background:transparent;color:#5b6675;');\n\n    return {\n      accent, showJson, isMap, isBoard: !isMap, ports, sel, kpis, legend, regions, mapBg,\n      syncText: '8 min ago', mapTabStyle, boardTabStyle,\n      showMap: () => this.setView('map'), showBoard: () => this.setView('board')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
